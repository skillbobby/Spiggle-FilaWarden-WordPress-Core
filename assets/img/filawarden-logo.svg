<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Orange Gradient -->
    <linearGradient id="orangeMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fba15a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    
    <!-- Slate Dark Gradient -->
    <linearGradient id="slateMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Shield (Slate) -->
  <path d="M256 32 L64 104 L64 304 C64 424 144 488 256 512 C368 488 448 424 448 304 L448 104 Z" fill="url(#slateMain)" filter="url(#glow)"/>
  
  <!-- Right Half Base Highlight (Creates the "Halved" look) -->
  <path d="M256 32 L448 104 L448 304 C448 424 368 488 256 512 Z" fill="#020617" opacity="0.4"/>

  <!-- Inner Shield (Brand Orange) -->
  <path d="M256 96 L128 144 L128 304 C128 392 184 440 256 464 C328 440 384 392 384 304 L384 144 Z" fill="url(#orangeMain)"/>
  
  <!-- Right Half Orange Depth Highlight -->
  <path d="M256 96 L384 144 L384 304 C384 392 328 440 256 464 Z" fill="#ea580c"/>

  <!-- Stylized Monogram / Tech Pulse -->
  <!-- Forms a 'W' for Warden, mimicking a heartbeat monitor and a security checkmark -->
  <path d="M 160 256 L 208 336 L 256 256 L 304 336 L 384 192" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Warden Eye / Data Node -->
  <circle cx="256" cy="168" r="24" fill="#ffffff"/>
</svg>
